<style>
:root {
  --brand: #6b1f3a; --brand-2: #d4581a; --brand-soft: #ffd8a8; --hl: #e8445a; --bg: #fdf7f5; --bg-rgb: 253,247,245; --bg-alt: #fbeee8; --surface: #ffffff; --ink: #6b1f3a; --text: #3f1e24; --muted: #85605f; --line: #efd9d3; --btn: #6b1f3a; --btn-ink: #ffffff; --link: #8e3a2c; --footer: #6b1f3a; --footer-text: #f3d9cf; --pop: #6b1f3a;
  --sans: "Fira Sans", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --serif: var(--sans);
  --cream: #fff6ee;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #290c16; --bg-rgb: 41,12,22; --bg-alt: #36101d; --surface: #4b1629; --ink: #fff6ee; --text: #ffe6d1; --muted: #c9a497; --line: #4e2532; --btn: #ffd8a8; --btn-ink: #6b1f3a; --link: #ffd8a8; --footer: #1e0910; --footer-text: #ffe5d0; --pop: #12050a; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #290c16; --bg-rgb: 41,12,22; --bg-alt: #36101d; --surface: #4b1629; --ink: #fff6ee; --text: #ffe6d1; --muted: #c9a497; --line: #4e2532; --btn: #ffd8a8; --btn-ink: #6b1f3a; --link: #ffd8a8; --footer: #1e0910; --footer-text: #ffe5d0; --pop: #12050a; color-scheme: dark; }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 96px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 1.0625rem/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
img { max-width: 100%; }
[hidden] { display: none !important; }
a { color: var(--link); text-underline-offset: 3px; text-decoration-thickness: 2px; text-decoration-color: color-mix(in srgb, var(--brand-2) 55%, transparent); }
a:hover { color: var(--hl); }
:focus-visible { outline: 3px solid var(--brand-2); outline-offset: 3px; border-radius: 6px; }
h1, h2, h3, h4 { color: var(--ink); margin: 0; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 clamp(18px, 4vw, 36px); }
.tba { color: var(--muted); font-style: italic; }

/* ---------- Floating pill navigation ---------- */
.nav { position: fixed; top: 14px; left: 0; right: 0; z-index: 50; pointer-events: none; }
.nav .wrap { display: flex; align-items: center; gap: 10px; }
.nav .bar {
  pointer-events: auto; display: flex; align-items: center; gap: 12px; width: 100%;
  background: rgba(var(--bg-rgb), .92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 2px solid var(--pop); border-radius: 999px; padding: 6px 8px 6px 16px; box-shadow: 3px 3px 0 var(--pop);
}
.brand { display: flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; font-weight: 700; font-size: .95rem; white-space: nowrap; }
.brand svg { width: 24px; height: 24px; color: var(--brand-2); }
.nav-links { display: flex; gap: 2px; margin: 0 0 0 auto; padding: 0; list-style: none; }
.nav-links a { display: block; padding: 7px 12px; border-radius: 999px; color: var(--text); text-decoration: none; font-size: .9rem; font-weight: 500; }
.nav-links a:hover { color: var(--ink); background: var(--bg-alt); }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--bg-alt); color: var(--ink); display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--brand-soft); color: #6b1f3a; }
.icon-btn svg { width: 18px; height: 18px; }
.menu-btn { display: none; }
@media (max-width: 980px) {
  .brand { min-width: 0; font-size: .9rem; }
  .brand span { overflow: hidden; text-overflow: ellipsis; }
  .menu-btn { display: grid; margin-left: auto; }
  .nav-links {
    display: none; position: absolute; top: calc(100% + 10px); left: clamp(18px, 4vw, 36px); right: clamp(18px, 4vw, 36px); flex-direction: column;
    background: var(--bg); border: 2px solid var(--pop); border-radius: 24px; padding: 10px; box-shadow: 3px 3px 0 var(--pop); pointer-events: auto;
  }
  .nav-links.open { display: flex; }
  .nav-links a { padding: 11px 14px; font-size: 1rem; }
}

/* ---------- Hero: a sea of level sets ---------- */
.hero { padding: 92px clamp(10px, 2vw, 22px) 0; }
.hero-panel {
  position: relative; overflow: hidden; border-radius: clamp(24px, 4vw, 44px);
  background: var(--brand); color: var(--cream); display: flex; flex-direction: column;
}
#mesh { position: relative; width: 100%; height: clamp(170px, 28vh, 290px); display: block; margin-top: auto; order: 2; }
.hero-inner { position: relative; z-index: 1; width: 100%; padding-top: clamp(44px, 7vw, 84px); padding-bottom: clamp(20px, 3vw, 36px); }
.hero-text { max-width: 820px; }
.kicker { display: flex; align-items: center; gap: 12px; margin: 0 0 24px; color: color-mix(in srgb, var(--cream) 78%, transparent); font-size: .95rem; font-weight: 400; letter-spacing: .02em; }
.kicker::before { content: ""; width: 28px; height: 1px; background: currentColor; }
.hero h1 { color: var(--cream); font: 400 clamp(2.2rem, 4.8vw, 3.9rem)/1.12 var(--sans); letter-spacing: -0.012em; text-wrap: balance; max-width: 19ch; }
.subtitle { margin: 18px 0 0; font: 300 clamp(1.15rem, 2vw, 1.45rem)/1.4 var(--sans); color: var(--cream); opacity: .8; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 0; margin: 36px 0 0; padding-top: 22px; border-top: 1px solid color-mix(in srgb, var(--cream) 22%, transparent); max-width: 640px; }
.hero-meta > div + div { margin-left: 28px; padding-left: 28px; border-left: 1px solid color-mix(in srgb, var(--cream) 22%, transparent); }
@media (max-width: 560px) { .hero-meta > div + div { margin: 14px 0 0; padding: 0; border: 0; width: 100%; } }
.hero-meta > div { display: flex; gap: 10px; align-items: flex-start; }
.hero-meta svg { width: 18px; height: 18px; color: color-mix(in srgb, var(--cream) 70%, transparent); margin-top: 3px; flex: none; }
.hero-meta dt { font-size: .85rem; font-weight: 300; color: color-mix(in srgb, var(--cream) 70%, transparent); }
.hero-meta dd { margin: 2px 0 0; font-size: 1.05rem; font-weight: 400; color: var(--cream); }
.hero-meta .tba { font-style: normal; font-weight: 400; color: color-mix(in srgb, var(--cream) 75%, transparent); }
.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
.hero .btn { background: var(--cream); color: #6b1f3a; border-color: var(--cream); border-radius: 10px; box-shadow: none; }
.hero .btn:hover { transform: none; background: var(--brand-soft); border-color: var(--brand-soft); }
.hero .btn:hover { color: #6b1f3a; }
.hero .btn.ghost { background: transparent; color: var(--cream); border-width: 1px; border-color: color-mix(in srgb, var(--cream) 45%, transparent); box-shadow: none; }
.hero .btn.ghost:hover { background: transparent; border-color: var(--cream); color: var(--cream); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 999px;
  background: var(--btn); color: var(--btn-ink); border: 2px solid var(--btn);
  font: 500 1rem/1.2 var(--sans); text-decoration: none; cursor: pointer;
  transition: transform .15s ease, box-shadow .15s ease;
}
.btn:hover { color: var(--btn-ink); transform: translate(-1px, -1px); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--pop); box-shadow: 3px 3px 0 var(--pop); }
.btn.ghost:hover { color: var(--ink); box-shadow: 4px 4px 0 var(--pop); }
.btn.small { padding: 8px 16px; font-size: .88rem; }
.btn.disabled { background: transparent; color: var(--muted); border: 2px dashed var(--line); cursor: default; transform: none; box-shadow: none; }

/* ---------- Sections ---------- */
.sec { position: relative; padding: clamp(64px, 9vw, 104px) 0; }
.sec.alt { background: var(--bg-alt); margin-top: 28px; }
.sec.alt::before, .sec.alt::after {
  content: ""; position: absolute; left: 0; right: 0; height: 28px; background: var(--bg-alt);
  -webkit-mask: radial-gradient(18px 15px at 50% 100%, #000 98%, transparent) 0 0 / 52px 28px repeat-x;
          mask: radial-gradient(18px 15px at 50% 100%, #000 98%, transparent) 0 0 / 52px 28px repeat-x;
}
.sec.alt::before { top: -27px; }
.sec.alt::after { bottom: -27px; transform: scaleY(-1); }
.sec.alt + .sec { padding-top: calc(clamp(64px, 9vw, 104px) + 20px); }
.sec-grid { display: block; }
.sec-head { margin-bottom: clamp(28px, 4vw, 44px); max-width: 720px; }
.sec-head h2 { font: 800 clamp(2rem, 4.2vw, 3.1rem)/1.05 var(--sans); letter-spacing: -0.02em; display: flex; align-items: center; gap: 14px; }
.sec-head h2::before { content: ""; width: .62em; height: .62em; flex: none; border-radius: 50% 50% 50% 8px; background: var(--brand-2); transform: rotate(-12deg); }
.sec:nth-of-type(3n+2) .sec-head h2::before { background: var(--hl); }
.sec:nth-of-type(3n) .sec-head h2::before { background: var(--brand-soft); }
.sec-intro { margin: 14px 0 0; color: var(--muted); font-size: 1.02rem; }
.sec-body > * + * { margin-top: 36px; }
.sec-body h3 { font: 700 1.3rem/1.25 var(--sans); }
.sec-body h3 + * { margin-top: 14px; }
.prose { max-width: 70ch; }
.prose p { margin: 0 0 1.1em; }
.prose p:last-child { margin-bottom: 0; }
.prose strong { color: var(--ink); font-weight: 600; }
.note { color: var(--muted); font-style: italic; margin: 0; }

.topics { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 10px; }
.topics li { padding: 8px 16px; border-radius: 999px; font-size: .94rem; font-weight: 500; background: color-mix(in srgb, var(--brand-soft) 60%, var(--surface)); color: #5a1a31; }
.topics li:nth-child(3n+2) { background: color-mix(in srgb, var(--hl) 22%, var(--surface)); }
.topics li:nth-child(3n) { background: color-mix(in srgb, var(--brand-2) 22%, var(--surface)); }
:root[data-theme="dark"] .topics li { color: var(--ink); background: color-mix(in srgb, var(--brand-soft) 18%, var(--surface)); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .topics li { color: var(--ink); background: color-mix(in srgb, var(--brand-soft) 18%, var(--surface)); } }

/* Important dates: a row of tickets */
.timeline { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
.timeline li { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 22px 22px 24px; background: var(--surface); border: 2px solid var(--pop); border-radius: 22px; box-shadow: 4px 4px 0 var(--pop); }
.timeline li::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--brand-2); }
.timeline li:last-child { background: var(--hl); border-color: var(--pop); }
.timeline li:last-child::before { background: var(--cream); }
.timeline li:last-child .when, .timeline li:last-child .what, .timeline li:last-child .tba { color: #fff; }
.timeline .when { font: 700 1.2rem/1.3 var(--sans); color: var(--ink); }
.timeline .what { color: var(--text); font-weight: 500; }

/* Registration */
.steps { list-style: none; margin: 0; padding: 0; counter-reset: step; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
.steps li { counter-increment: step; position: relative; background: var(--surface); border: 2px solid var(--pop); border-radius: 24px; padding: 30px 26px 26px; box-shadow: 4px 4px 0 var(--pop); }
.steps li::before {
  content: counter(step); position: absolute; right: 20px; top: -18px; width: 48px; height: 48px; border-radius: 50%;
  display: grid; place-items: center; font: 800 1.35rem/1 var(--sans); color: #fff; background: var(--brand-2); border: 2px solid var(--pop); transform: rotate(8deg);
}
.steps h3 { font: 700 1.25rem/1.3 var(--sans); padding-right: 40px; }

/* Schedule */
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.tab { appearance: none; padding: 9px 18px; cursor: pointer; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); font: 600 .95rem var(--sans); color: var(--muted); }
.tab[aria-selected="true"] { color: #fff; background: var(--brand-2); border-color: var(--brand-2); }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"]:hover { color: #fff; }
.table-wrap { overflow-x: auto; background: var(--surface); border: 2px solid var(--pop); border-radius: 22px; box-shadow: 4px 4px 0 var(--pop); }
.sched { width: 100%; border-collapse: collapse; font-size: .97rem; }

.speakers { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 22px; }

.speaker .top { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.avatar { width: 84px; height: 84px; border-radius: 50%; flex: none; object-fit: cover; background: var(--brand-soft); display: grid; place-items: center; color: #6b1f3a; font: 800 1.5rem var(--sans); border: 2px solid var(--pop); }
.avatar svg { width: 36px; height: 36px; }
.speaker h3 { font: 700 1.3rem/1.2 var(--sans); }
.speaker .aff { margin: 4px 0 0; font-size: .9rem; color: var(--muted); line-height: 1.45; }
.speaker .talk { margin: 18px 0 0; font: italic 500 1.12rem/1.4 var(--sans); color: var(--ink); }
.speaker details { margin-top: 16px; border-top: 2px dashed var(--line); padding-top: 12px; }
.speaker summary { cursor: pointer; font-weight: 700; font-size: .9rem; color: var(--brand-2); list-style: none; display: inline-flex; gap: 6px; align-items: center; }
.speaker summary::-webkit-details-marker { display: none; }
.speaker summary::after { content: "+"; font-weight: 700; font-size: 1.1rem; }
.speaker details[open] summary::after { content: "−"; }
.speaker .abstract { margin-top: 10px; font-size: .95rem; }
.speaker .abstract p { margin: 0 0 .8em; }
.speaker.empty { border-style: dashed; border-color: color-mix(in srgb, var(--muted) 60%, transparent); box-shadow: none; background: transparent; }
.speaker.empty .avatar { background: var(--bg-alt); border-style: dashed; border-color: color-mix(in srgb, var(--muted) 60%, transparent); color: var(--brand-2); }

/* Talks lists */
.talks { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.talks li { padding: 14px 18px; background: var(--surface); border-radius: 18px; border-left: 6px solid var(--brand-2); }
.talks li:nth-child(even) { border-left-color: var(--hl); }
.talks .who { font-weight: 700; color: var(--ink); }
.talks .aff { color: var(--muted); font-size: .92rem; }
.talks .title { display: block; margin-top: 4px; font: italic 400 1.08rem/1.4 var(--sans); color: var(--text); }

/* Venue */
.venue-name { font: 700 1.4rem/1.3 var(--sans); color: var(--ink); margin: 0; }
.venue-addr { margin: 4px 0 0; color: var(--muted); }
.map { position: relative; aspect-ratio: 16 / 8; border-radius: 26px; overflow: hidden; border: 2px solid var(--pop); box-shadow: 5px 5px 0 var(--pop); background: var(--surface); }
.map iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.map.placeholder { display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted);
  background: radial-gradient(circle at 20% 30%, color-mix(in srgb, var(--brand-soft) 55%, transparent) 0 70px, transparent 71px),
              radial-gradient(circle at 78% 64%, color-mix(in srgb, var(--hl) 22%, transparent) 0 110px, transparent 111px),
              radial-gradient(circle, var(--line) 1.5px, transparent 2px) 0 0 / 22px 22px, var(--surface); }
.map.placeholder span { background: var(--surface); padding: 10px 18px; border-radius: 999px; border: 2px solid var(--line); }
.hotels { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.hotels li { display: flex; justify-content: space-between; gap: 16px; padding: 12px 20px; background: var(--surface); border: 2px solid var(--line); border-radius: 999px; }
.hotels .stars { color: var(--brand-2); letter-spacing: 2px; white-space: nowrap; }
.contact-line { margin: 0; font-weight: 500; }

/* Organisers */
.group + .group { margin-top: 40px; }
.members { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.members li { display: flex; gap: 14px; align-items: center; padding: 10px 14px 10px 10px; background: var(--surface); border-radius: 999px; }
.members .avatar { width: 52px; height: 52px; font-size: 1.05rem; border-width: 0; }
.members li:nth-child(3n+2) .avatar { background: color-mix(in srgb, var(--hl) 30%, var(--surface)); }
.members li:nth-child(3n) .avatar { background: color-mix(in srgb, var(--brand-2) 30%, var(--surface)); }
.members .avatar svg { width: 24px; height: 24px; }
.members strong { display: block; color: var(--ink); font-weight: 600; line-height: 1.3; }
.members span { display: block; font-size: .87rem; color: var(--muted); line-height: 1.4; }

/* Institutions */
.logos { display: flex; flex-wrap: wrap; gap: 14px; }
.logos a, .logos .logo { height: 96px; min-width: 132px; padding: 14px 22px; background: #fff; border: 2px solid var(--line); border-radius: 22px; display: grid; place-items: center; transition: border-color .15s ease, transform .15s ease; }
.logos a:hover { border-color: var(--brand-2); transform: rotate(-1.5deg); }
.logos img { max-height: 64px; max-width: 170px; object-fit: contain; display: block; }
.logo-label { font-size: .95rem; font-weight: 600; color: var(--muted); margin: 0 0 12px; }

/* Footer */
footer { position: relative; background: var(--footer); color: var(--footer-text); padding: 56px 0 48px; font-size: .95rem; margin-top: 40px; }
footer::before { content: ""; position: absolute; left: 0; right: 0; top: -27px; height: 28px; background: var(--footer);
  -webkit-mask: radial-gradient(18px 15px at 50% 100%, #000 98%, transparent) 0 0 / 52px 28px repeat-x;
          mask: radial-gradient(18px 15px at 50% 100%, #000 98%, transparent) 0 0 / 52px 28px repeat-x; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 16px 32px; justify-content: space-between; align-items: center; }
footer a { color: #fff; }
footer a:hover { color: var(--brand-soft); }
footer .links { display: flex; gap: 24px; flex-wrap: wrap; }
@media (prefers-reduced-motion: reduce) { .btn, .logos a { transition: none; } }

<body>

<main id="main"></main>
<footer><div class="wrap" id="footerContent"></div></footer>

<script>
(function () {
  "use strict";

  /* ---------------- helpers ---------------- */
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const has = (v) => v != null && String(v).trim() !== "";
  const tba = (v, fallback) => has(v) ? esc(v) : '<span class="tba">' + esc(fallback || "To be announced") + "</span>";
  let DATA = {};

  // Replace {year}, {dates}, {venue}, {city}-style tokens in editable text
  function fill(s) {
    const h = DATA.hero || {}, v = DATA.venue || {};
    const map = {
      year: (DATA.meta && DATA.meta.year) || "",
      dates: has(h.dates) ? h.dates : "dates to be announced",
      venue: has(v.name) ? v.name : (has(h.location) ? h.location : "a venue to be announced"),
      location: has(h.location) ? h.location : "a location to be announced"
    };
    return String(s == null ? "" : s).replace(/\{(year|dates|venue|location)\}/g, (_, k) => map[k]);
  }
  // Tiny markdown: **bold**, *italic*, [text](link). Math ($...$) is left for KaTeX.
  function md(s) {
    let h = esc(fill(s));
    h = h.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => '<a href="' + u + '" target="_blank" rel="noopener">' + t + "</a>");
    h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    h = h.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, "$1<em>$2</em>");
    return h;
  }
  const paras = (s) => String(s || "").split(/\n\s*\n/).filter((p) => p.trim()).map((p) => "<p>" + md(p.trim()) + "</p>").join("");
  const url = (u) => esc(String(u || "").trim());
  const ext = (u) => /^https?:/i.test(String(u)) ? ' target="_blank" rel="noopener"' : "";
  const initials = (n) => String(n || "").trim().split(/\s+/).filter(Boolean).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
  const TRI = '<svg viewBox="0 0 32 32" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M3 12c3.3-4 6.7-4 10 0s6.7 4 10 0 4.5-2.5 6-2"/><path d="M3 21c3.3-4 6.7-4 10 0s6.7 4 10 0 4.5-2.5 6-2"/></g></svg>';
  function avatar(photo, name) {
    if (has(photo)) return '<img class="avatar" src="' + url(photo) + '" alt="' + esc(name || "") + '" loading="lazy">';
    return '<div class="avatar" aria-hidden="true">' + (has(name) ? esc(initials(name)) : TRI) + "</div>";
  }
  const ICON_PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
  const ICON_CAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';


  /* ---------------- colours (from content.js "theme") ---------------- */
  const h2r = (h) => { h = String(h || "").trim().replace("#", ""); if (h.length === 3) h = h.split("").map((c) => c + c).join(""); const n = parseInt(h, 16) || 0; return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const r2h = (r) => "#" + r.map((x) => Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2, "0")).join("");
  const mix = (a, b, t) => { const A = h2r(a), B = h2r(b); return r2h(A.map((v, i) => v * (1 - t) + B[i] * t)); };
  const rgba = (a, al) => "rgba(" + h2r(a).join(",") + "," + al + ")";
  const isHex = (v) => /^#?[0-9a-f]{6}$/i.test(String(v || "").trim());
  function applyTheme(t) {
    t = t || {};
    const B = isHex(t.primary) ? t.primary : "#6b1f3a", S = isHex(t.secondary) ? t.secondary : "#d4581a",
          L = isHex(t.light) ? t.light : "#ffd8a8", R = isHex(t.highlight) ? t.highlight : "#e8445a", W = "#ffffff", K = "#000000";
    const bg = mix(W, S, .045), dbg = mix(B, K, .62);
    const light = { "--brand": B, "--brand-2": S, "--brand-soft": L, "--hl": R, "--bg": bg, "--bg-rgb": h2r(bg).join(","), "--bg-alt": mix(W, S, .1), "--surface": W,
      "--ink": B, "--text": mix(B, "#2a1d1a", .55), "--muted": mix(B, "#9a8a80", .6), "--line": mix(mix(W, S, .1), B, .12), "--btn": B, "--btn-ink": W, "--link": mix(B, S, .35),
      "--footer": B, "--footer-text": mix(B, W, .78), "--pop": B, "--mesh-lo": bg, "--mesh-mid": L, "--mesh-hi": S, "--mesh-line": rgba(B, .13) };
    const dark = { "--brand": B, "--brand-2": S, "--brand-soft": L, "--hl": R, "--bg": dbg, "--bg-rgb": h2r(dbg).join(","), "--bg-alt": mix(B, K, .5), "--surface": mix(B, K, .45),
      "--ink": "#fff6ee", "--text": mix(L, W, .35), "--muted": mix(L, dbg, .38), "--line": mix(dbg, L, .16), "--btn": L, "--btn-ink": B, "--link": L,
      "--footer": mix(B, K, .72), "--footer-text": mix(L, W, .3), "--pop": mix(B, K, .82), "--mesh-lo": dbg, "--mesh-mid": mix(B, K, .25), "--mesh-hi": S, "--mesh-line": rgba(L, .12) };
    const css = (o) => Object.keys(o).map((k) => k + ":" + o[k] + ";").join("");
    let el = document.getElementById("themeVars");
    if (!el) { el = document.createElement("style"); el.id = "themeVars"; document.head.appendChild(el); }
    el.textContent = ":root{" + css(light) + "color-scheme:light}" +
      "@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){" + css(dark) + "color-scheme:dark}}" +
      ":root[data-theme=\"dark\"]{" + css(dark) + "color-scheme:dark}";
    const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.setAttribute("content", B);
  }

  /* ---------------- section builders ---------------- */
  function section(id, title, intro, body) {
    return { id, html: (alt) => '<section id="' + id + '" class="sec' + (alt ? " alt" : "") + '"><div class="wrap sec-grid"><header class="sec-head"><h2>' + esc(title) + "</h2>" + (has(intro) ? '<p class="sec-intro">' + md(intro) + "</p>" : "") + '</header><div class="sec-body">' + body + "</div></div></section>" };
  }

  function buildAbout(d) {
    const a = d.about || {}, t = d.topics || {};
    let body = '<div class="prose">' + (a.paragraphs || []).filter(has).map((p) => "<p>" + md(p) + "</p>").join("") + "</div>";
    const items = (t.items || []).filter(has);
    if (items.length) {
      body += "<div><h3>Topics</h3>" + (has(t.intro) ? '<p style="margin:10px 0 16px">' + md(t.intro) + "</p>" : "") +
        '<ul class="topics">' + items.map((x) => "<li>" + esc(x) + "</li>").join("") + "</ul></div>";
    }
    return section("about", "About the meeting", "", body);
  }

  function buildDates(d) {
    const list = (d.importantDates || []).filter((x) => has(x.event) || has(x.date));
    const body = list.length
      ? '<ol class="timeline">' + list.map((x) => '<li><span class="when">' + tba(x.date, "Date to be announced") + '</span><span class="what">' + esc(x.event) + "</span></li>").join("") + "</ol>"
      : '<p class="note">Dates will be announced soon.</p>';
    return section("dates", "Important dates", "", body);
  }

  function buildRegistration(d) {
    const r = d.registration || {};
    const steps = (r.steps || []).filter((s) => has(s.title));
    const body = steps.length ? '<ol class="steps">' + steps.map((s) =>
      "<li><h3>" + esc(s.title) + '</h3><p class="deadline">Deadline: ' + (has(s.deadline) ? "<strong>" + esc(s.deadline) + "</strong>" : '<span class="tba">to be announced</span>') + "</p>" +
      (has(s.description) ? '<p class="desc">' + md(s.description) + "</p>" : '<p class="desc"></p>') +
      (has(s.link) ? '<a class="btn small" href="' + url(s.link) + '"' + ext(s.link) + ">" + esc(s.linkLabel || "Open form") + "</a>" : '<span class="btn small disabled">Form opens soon</span>') +
      "</li>").join("") + "</ol>" : '<p class="note">Registration details will be announced soon.</p>';
    return section("registration", "Registration", r.intro, body);
  }

  function buildSchedule(d) {
    const s = d.schedule || {};
    const days = (s.days || []).filter((x) => x);
    if (!days.length) return section("schedule", "Schedule", s.intro, '<p class="note">The programme will be published soon.</p>');
    const pause = /break|lunch|coffee|dinner/i;
    let body = '<div><div class="tabs" role="tablist" aria-label="Meeting days">' +
      days.map((day, i) => '<button class="tab" role="tab" id="tab-' + i + '" aria-controls="panel-' + i + '" aria-selected="' + (i === 0) + '" tabindex="' + (i === 0 ? 0 : -1) + '">' + (has(day.label) ? esc(day.label) : "Day " + (i + 1)) + "</button>").join("") + "</div>";
    body += days.map((day, i) => {
      const rows = (day.sessions || []).map((x) => {
        const cls = [!has(x.time) && !has(x.programme) ? "cont" : "", pause.test(x.programme || "") ? "pause" : ""].join(" ").trim();
        const time = has(x.time) ? esc(x.time) : (has(x.programme) ? '<span class="dash">TBA</span>' : "");
        return "<tr" + (cls ? ' class="' + cls + '"' : "") + '><td class="time">' + time + '</td><td class="prog">' + esc(x.programme || "") + "</td><td>" + (has(x.speaker) ? esc(x.speaker) : '<span class="dash">—</span>') + "</td></tr>";
      }).join("");
      return '<div class="table-wrap" role="tabpanel" id="panel-' + i + '" aria-labelledby="tab-' + i + '"' + (i ? " hidden" : "") + '><table class="sched"><thead><tr><th>Time</th><th>Programme</th><th>Speaker</th></tr></thead><tbody>' + rows + "</tbody></table></div>";
    }).join("") + "</div>";
    if (has(s.programmeUrl)) body += '<div><a class="btn ghost small" href="' + url(s.programmeUrl) + '"' + ext(s.programmeUrl) + ">Download the full programme (PDF)</a></div>";
    return section("schedule", "Schedule", s.intro, body);
  }

  function buildSpeakers(d) {
    const list = d.keynotes || [];
    const body = list.length ? '<div class="speakers">' + list.map((k) => {
      const empty = !has(k.name);
      return '<article class="speaker' + (empty ? " empty" : "") + '"><div class="top">' + avatar(k.photo, k.name) + "<div><h3>" + (empty ? '<span class="tba">Speaker to be announced</span>' : esc(k.name)) + "</h3>" +
        (has(k.affiliation) ? '<p class="aff">' + esc(k.affiliation) + "</p>" : "") + "</div></div>" +
        (has(k.title) ? '<p class="talk">' + md(k.title) + "</p>" : (empty ? "" : '<p class="talk tba">Talk title to be announced</p>')) +
        (has(k.abstract) ? '<details><summary>Abstract</summary><div class="abstract">' + paras(k.abstract) + "</div></details>" : "") +
        "</article>";
    }).join("") + "</div>" : '<p class="note">Keynote speakers will be announced soon.</p>';
    return section("speakers", "Keynote talks", "", body);
  }

  function talkList(list, note) {
    list = (list || []).filter((t) => has(t.name) || has(t.title));
    if (!list.length) return '<p class="note">' + esc(note || "To be announced.") + "</p>";
    return '<ul class="talks">' + list.map((t) => '<li><span class="who">' + esc(t.name) + "</span>" + (has(t.affiliation) ? '<span class="aff">, ' + esc(t.affiliation) + "</span>" : "") + (has(t.title) ? '<span class="title">' + md(t.title) + "</span>" : "") + "</li>").join("") + "</ul>";
  }
  function buildTalks(d) {
    const t = d.talks || {};
    const body = "<div><h3>Contributed and invited talks</h3>" + talkList(t.contributed, t.contributedNote) + "</div>" +
      "<div><h3>Poster session</h3>" + talkList(t.posters, t.postersNote) + "</div>";
    return section("talks", "Talks and posters", "", body);
  }

  function buildVenue(d) {
    const v = d.venue || {}, a = d.accommodation || {}, c = d.contact || {};
    let body = "<div>" + (has(v.name) ? '<p class="venue-name">' + esc(v.name) + "</p>" : '<p class="venue-name tba">Venue to be announced</p>') +
      (has(v.address) ? '<p class="venue-addr">' + esc(v.address) + "</p>" : "") + "</div>";
    const dirs = (v.directions || []).filter(has);
    if (dirs.length) body += '<div class="prose">' + dirs.map((p) => "<p>" + md(p) + "</p>").join("") + "</div>";
    body += has(v.mapEmbedUrl)
      ? '<div class="map"><iframe src="' + url(v.mapEmbedUrl) + '" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade" title="Map of the venue"></iframe></div>'
      : '<div class="map placeholder"><span>The map will appear once the venue is confirmed.</span></div>';
    if (has(v.mapLinkUrl)) body += '<div><a class="btn ghost small" href="' + url(v.mapLinkUrl) + '" target="_blank" rel="noopener">Open in Google Maps</a></div>';
    const hotels = (a.hotels || []).filter((h) => has(h.name));
    body += "<div><h3>Accommodation</h3>" + (hotels.length
      ? (has(a.intro) ? '<p style="margin:10px 0 14px">' + md(a.intro) + "</p>" : "") + '<ul class="hotels">' + hotels.map((h) => "<li>" + (has(h.url) ? '<a href="' + url(h.url) + '" target="_blank" rel="noopener">' + esc(h.name) + "</a>" : esc(h.name)) + '<span class="stars" aria-label="' + (parseInt(h.stars, 10) || 0) + ' stars">' + "★".repeat(Math.min(5, parseInt(h.stars, 10) || 0)) + "</span></li>").join("") + "</ul>"
      : '<p class="note">Suggestions for accommodation will be added once the venue is confirmed.</p>') + "</div>";
    if (has(a.extraUrl)) body += '<div><a class="btn ghost small" href="' + url(a.extraUrl) + '"' + ext(a.extraUrl) + ">" + esc(a.extraLabel || "More information") + "</a></div>";
    if (has(c.email)) body += '<p class="contact-line">Questions? Write to us at <a href="mailto:' + url(c.email) + '">' + esc(c.email) + "</a>.</p>";
    return section("venue", "Venue and travel", "", body);
  }

  function buildOrganisers(d) {
    const groups = (d.organisers || []).filter((g) => has(g.title) || (g.members || []).length);
    const body = groups.length ? groups.map((g) => {
      const m = (g.members || []).filter((x) => has(x.name));
      return '<div class="group"><h3>' + esc(g.title) + "</h3>" + (m.length
        ? '<ul class="members">' + m.map((x) => "<li>" + avatar(x.photo, x.name) + "<div><strong>" + esc(x.name) + "</strong>" + (has(x.affiliation) ? "<span>" + esc(x.affiliation) + "</span>" : "") + "</div></li>").join("") + "</ul>"
        : '<p class="note">To be announced.</p>') + "</div>";
    }).join("") : '<p class="note">To be announced.</p>';
    return section("organisers", "Organisers", "", body);
  }

  function logoRow(list) {
    list = (list || []).filter((x) => has(x.logo) || has(x.name));
    return '<div class="logos">' + list.map((x) => {
      const inner = has(x.logo) ? '<img src="' + url(x.logo) + '" alt="' + esc(x.name) + '" loading="lazy">' : '<span style="color:var(--brand);font-weight:600;text-align:center">' + esc(x.name) + "</span>";
      return has(x.url) ? '<a href="' + url(x.url) + '" target="_blank" rel="noopener" title="' + esc(x.name) + '">' + inner + "</a>" : '<div class="logo">' + inner + "</div>";
    }).join("") + "</div>";
  }
  function buildInstitutions(d) {
    const i = d.institutions || {};
    let body = "";
    if ((i.contributors || []).length) body += '<div><p class="logo-label">Contributors</p>' + logoRow(i.contributors) + "</div>";
    if ((i.chapters || []).length) body += '<div><p class="logo-label">' + md(i.chaptersIntro || "Participating SIAM Student Chapters") + "</p>" + logoRow(i.chapters) + "</div>";
    if ((i.patronage || []).length) body += '<div><p class="logo-label">Under the auspices of</p>' + logoRow(i.patronage) + "</div>";
    return section("institutions", "Institutions involved", "", body || '<p class="note">To be announced.</p>');
  }

  /* ---------------- render ---------------- */
  const NAV = [["about", "About"], ["dates", "Dates"], ["registration", "Registration"], ["schedule", "Schedule"], ["speakers", "Speakers"], ["talks", "Talks"], ["venue", "Venue"], ["organisers", "Organisers"]];
  const BUILD = { about: buildAbout, dates: buildDates, registration: buildRegistration, schedule: buildSchedule, speakers: buildSpeakers, talks: buildTalks, venue: buildVenue, organisers: buildOrganisers, institutions: buildInstitutions };

  function render(d) {
    DATA = d || {};
    applyTheme(DATA.theme);
    if (typeof colors !== "undefined" && colors) readColors();
    const show = Object.assign({ about: true, dates: true, registration: true, schedule: true, speakers: true, talks: true, venue: true, organisers: true, institutions: true }, DATA.sections || {});
    const meta = DATA.meta || {}, h = DATA.hero || {};
    document.title = meta.pageTitle || "SIAM Chapters Meeting";
    if (has(meta.description)) $("metaDesc").setAttribute("content", meta.description);
    $("brandText").textContent = "SIAM Chapters Meeting" + (has(meta.year) ? " " + meta.year : "");

    $("navLinks").innerHTML = NAV.filter(([k]) => show[k]).map(([k, l]) => '<li><a href="#' + k + '">' + l + "</a></li>").join("");

    const ctaHref = has(h.ctaUrl) ? url(h.ctaUrl) : "#registration";
    $("heroContent").innerHTML =
      (has(h.kicker) ? '<p class="kicker">' + esc(fill(h.kicker)) + "</p>" : "") +
      "<h1>" + esc(fill(h.title || "SIAM Chapters Meeting")) + "</h1>" +
      (has(h.subtitle) ? '<p class="subtitle">' + esc(fill(h.subtitle)) + "</p>" : "") +
      '<dl class="hero-meta"><div>' + ICON_PIN + "<div><dt>Where</dt><dd>" + tba(h.location, "Venue to be announced") + "</dd></div></div><div>" + ICON_CAL + "<div><dt>When</dt><dd>" + tba(h.dates, "Dates to be announced") + "</dd></div></div></dl>" +
      '<div class="hero-actions">' + (show.registration || has(h.ctaUrl) ? '<a class="btn" href="' + ctaHref + '"' + ext(h.ctaUrl) + ">" + esc(h.ctaLabel || "Register") + "</a>" : "") +
      '<a class="btn ghost" href="#about">About the meeting</a></div>';

    const parts = Object.keys(BUILD).filter((k) => show[k]).map((k) => BUILD[k](DATA));
    $("main").innerHTML = parts.map((p, i) => p.html(i % 2 === 1)).join("");

    const f = DATA.footer || {}, c = DATA.contact || {};
    $("footerContent").innerHTML = "<span>" + esc(fill(f.text || "")) + '</span><span class="links">' +
      (has(c.email) ? '<a href="mailto:' + url(c.email) + '">' + esc(c.email) + "</a>" : "") +
      (has(f.privacyUrl) ? '<a href="' + url(f.privacyUrl) + '" target="_blank" rel="noopener">Privacy policy</a>' : "") + "</span>";

    bindTabs();
    maybeMath();
  }

  function bindTabs() {
    const tabs = Array.from(document.querySelectorAll(".tab"));
    function select(i) {
      tabs.forEach((t, j) => {
        t.setAttribute("aria-selected", String(i === j)); t.tabIndex = i === j ? 0 : -1;
        const p = $("panel-" + j); if (p) p.hidden = i !== j;
      });
    }
    tabs.forEach((t, i) => {
      t.addEventListener("click", () => select(i));
      t.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
          const n = (i + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length; select(n); tabs[n].focus();
        }
      });
    });
  }

  // Load KaTeX only when an abstract contains $math$
  let katexLoading = null;
  function maybeMath() {
    const text = JSON.stringify(DATA.keynotes || []) + JSON.stringify((DATA.talks || {}));
    if (!/\$[^$]+\$/.test(text)) return;
    const run = () => window.renderMathInElement && window.renderMathInElement($("main"), { delimiters: [{ left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false }], throwOnError: false });
    if (window.renderMathInElement) return run();
    if (!katexLoading) {
      const base = "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/";
      const css = document.createElement("link"); css.rel = "stylesheet"; css.href = base + "katex.min.css"; document.head.appendChild(css);
      const load = (src) => new Promise((ok, ko) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = ko; document.head.appendChild(s); });
      katexLoading = load(base + "katex.min.js").then(() => load(base + "contrib/auto-render.min.js")).catch(() => {});
    }
    katexLoading.then(run);
  }

  /* ---------------- nav, theme ---------------- */
  const nav = $("nav");
  const onScroll = () => nav.classList.toggle("scrolled", window.scrollY > 24);
  window.addEventListener("scroll", onScroll, { passive: true }); onScroll();
  $("menuBtn").addEventListener("click", () => {
    const open = $("navLinks").classList.toggle("open");
    $("menuBtn").setAttribute("aria-expanded", String(open));
  });
  $("navLinks").addEventListener("click", (e) => { if (e.target.closest("a")) { $("navLinks").classList.remove("open"); $("menuBtn").setAttribute("aria-expanded", "false"); } });

  const root = document.documentElement;
  const sysDark = window.matchMedia("(prefers-color-scheme: dark)");
  function currentTheme() { return root.dataset.theme || (sysDark.matches ? "dark" : "light"); }
  function syncThemeIcon() { const dark = currentTheme() === "dark"; $("iconSun").hidden = dark; $("iconMoon").hidden = !dark; }
  try { const t = localStorage.getItem("siam-theme"); if (t === "dark" || t === "light") root.dataset.theme = t; } catch (e) {}
  syncThemeIcon();
  $("themeBtn").addEventListener("click", () => {
    root.dataset.theme = currentTheme() === "dark" ? "light" : "dark";
    try { localStorage.setItem("siam-theme", root.dataset.theme); } catch (e) {}
    syncThemeIcon(); readColors();
  });
  sysDark.addEventListener && sysDark.addEventListener("change", () => { syncThemeIcon(); readColors(); });

  /* ---------------- hero: the Ligurian sea as moving level curves ---------------- */
  const canvas = $("mesh"), ctx = canvas.getContext("2d");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, colors = null, running = true, raf = 0;
  const mouse = { x: -1e4, y: -1e4, tx: -1e4, ty: -1e4 };
  function readColors() {
    const cs = getComputedStyle(root), v = (n) => cs.getPropertyValue(n).trim();
    colors = [v("--brand-soft"), v("--brand-2"), v("--hl"), v("--brand-soft"), v("--brand-2")];
    if (reduce) draw(0);
  }
  function build() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(performance.now());
  }
  function draw(t) {
    if (!colors || !W) return;
    mouse.x += (mouse.tx - mouse.x) * .08; mouse.y += (mouse.ty - mouse.y) * .08;
    ctx.clearRect(0, 0, W, H);
    const n = 9, gap = H / (n + 1), lw = Math.max(10, gap * .42);
    ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = lw;
    for (let i = 0; i < n; i++) {
      const base = gap * (i + 1.2), k = i / n, amp = gap * (.25 + .45 * k);
      ctx.beginPath();
      for (let x = -20; x <= W + 20; x += 8) {
        let y = base + amp * Math.sin(x * .006 + t * .0006 * (1 + k) + i * 1.7) + amp * .45 * Math.sin(x * .013 - t * .0004 + i);
        const dx = x - mouse.x, dy = base - mouse.y;
        y -= 38 * Math.exp(-(dx * dx) / 9000 - (dy * dy) / 12000);
        x === -20 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = colors[i % colors.length]; ctx.globalAlpha = .55 + .45 * k; ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  function loop(t) { if (running) draw(t); raf = requestAnimationFrame(loop); }
  window.addEventListener("pointermove", (e) => { const r = canvas.getBoundingClientRect(); mouse.tx = e.clientX - r.left; mouse.ty = e.clientY - r.top; }, { passive: true });
  document.addEventListener("pointerleave", () => { mouse.tx = mouse.ty = -1e4; });
  let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(build, 120); });
  if ("IntersectionObserver" in window) new IntersectionObserver((en) => { running = en[0].isIntersecting && !document.hidden; }).observe(canvas);
  document.addEventListener("visibilitychange", () => { running = !document.hidden; });

  /* ---------------- start ---------------- */
  render(window.SITE_CONTENT || {});
  readColors(); build();
  if (!reduce) raf = requestAnimationFrame(loop);

  // Live preview support for editor.html
  if (/[?&]preview=1/.test(location.search)) {
    window.addEventListener("message", (e) => {
      const m = e.data || {};
      if (m.type === "siam-preview" && m.data) { const y = window.scrollY; render(m.data); window.scrollTo(0, y); }
      if (m.type === "siam-scroll" && m.id) { const el = document.getElementById(m.id); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }
    });
    if (window.parent !== window) window.parent.postMessage({ type: "siam-preview-ready" }, "*");
  }
})();
</script>
</body>
